syntax = "proto3";

package agenteam.v1;

import "google/api/annotations.proto";
import "common.proto";

option go_package = "github.com/hwanyan/agenteam/pb/gen/;agenteamv1";

// AgentService 负责 Agent 的查询、更新（保存并重新加载），
// 以及可选模型 / MCP 工具 / Skill 选项的查询。
service AgentService {
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option (google.api.http) = {
      get: "/v1/agents/{id}"
    };
  }

  // 返回指定团队下的全部 Agent（含主 Agent），按创建时间升序排列。
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (google.api.http) = {
      get: "/v1/teams/{team_id}/agents"
    };
  }

  // 在指定团队下创建一个新的非主 Agent，并触发服务端加载。
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/agents"
      body: "*"
    };
  }

  // 探测一个 A2A（Agent2Agent）协议的外部 Agent：向 endpoint_url 发起 Agent Card
  // 发现请求，返回对端名称/描述/技能/是否支持流式等信息，供前端在正式创建/保存前
  // 预览与校验连通性，不产生任何持久化副作用。
  rpc DiscoverA2AAgent(DiscoverA2AAgentRequest) returns (DiscoverA2AAgentResponse) {
    option (google.api.http) = {
      post: "/v1/a2a/discover"
      body: "*"
    };
  }

  // 保存 Agent 配置并触发服务端重新加载该 Agent。
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {
    option (google.api.http) = {
      put: "/v1/agents/{id}"
      body: "*"
    };
  }

  // 删除一个非主 Agent；主 Agent（团队创建时自动生成）不可删除，
  // 只能随 DeleteTeam 一起删除。
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {
    option (google.api.http) = {
      delete: "/v1/agents/{id}"
    };
  }

  rpc ListModelOptions(ListModelOptionsRequest) returns (ListModelOptionsResponse) {
    option (google.api.http) = {
      get: "/v1/options/models"
    };
  }

  // 返回可选的 MCP 工具清单：平台内置静态清单 + 指定团队（team_id 作为查询参数，
  // 如 ?team_id=xxx）自行接入的自定义 MCP 工具（按团队隔离，不同团队互不可见）。
  // team_id 留空（如"新增团队"表单场景，团队尚未创建）时只返回内置静态清单。
  rpc ListMcpToolOptions(ListMcpToolOptionsRequest) returns (ListMcpToolOptionsResponse) {
    option (google.api.http) = {
      get: "/v1/options/mcp-tools"
    };
  }

  rpc ListSkillOptions(ListSkillOptionsRequest) returns (ListSkillOptionsResponse) {
    option (google.api.http) = {
      get: "/v1/options/skills"
    };
  }

  // 在指定团队下接入一个新的自定义 MCP 工具；成功后会与内置工具合并出现在该团队的
  // ListMcpToolOptions 返回的可选清单中，仅供该团队的 Agent 选择绑定（按团队隔离）。
  rpc CreateMcpTool(CreateMcpToolRequest) returns (CreateMcpToolResponse) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/mcp-tools"
      body: "*"
    };
  }

  // 查询单个自定义 MCP 工具的详情（供编辑表单回填；api_key 不回显明文，只有 api_key_set 标记）。
  rpc GetMcpTool(GetMcpToolRequest) returns (GetMcpToolResponse) {
    option (google.api.http) = {
      get: "/v1/mcp-tools/{id}"
    };
  }

  // 更新一个自定义 MCP 工具的配置信息；api_key 为空表示"不修改现有密钥"，非空则覆盖
  // （与 UpdateAgent 对 A2A auth_token 的处理方式一致，避免每次保存都必须回传明文密钥）。
  rpc UpdateMcpTool(UpdateMcpToolRequest) returns (UpdateMcpToolResponse) {
    option (google.api.http) = {
      put: "/v1/mcp-tools/{id}"
      body: "*"
    };
  }
}

message GetAgentRequest {
  string id = 1;
}

message GetAgentResponse {
  Agent agent = 1;
}

message ListAgentsRequest {
  string team_id = 1;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message CreateAgentRequest {
  string team_id = 1;
  string name = 2;
  string prompt = 3;             // kind=AGENT_KIND_PROMPT 时必填
  string model = 4;              // kind=AGENT_KIND_PROMPT 时必填
  repeated string mcp_tools = 5;
  repeated string skills = 6;
  AgentKind kind = 7;             // 默认 AGENT_KIND_PROMPT（未指定时按 Prompt 方式创建，兼容旧客户端）
  A2AConfig a2a_config = 8;      // kind=AGENT_KIND_A2A 时必填（至少填 endpoint_url）
}

message CreateAgentResponse {
  Agent agent = 1;
}

message DiscoverA2AAgentRequest {
  string endpoint_url = 1;
  string auth_scheme = 2;
  string auth_token = 3;
  string tenant_id = 4; // 对应 X-A2A-Tenant-Id 请求头，部分对端要求的"双因子鉴权"身份声明
}

message DiscoverA2AAgentResponse {
  string remote_agent_name = 1;
  string remote_description = 2;
  repeated string remote_skills = 3;
  bool streaming = 4;
}

message UpdateAgentRequest {
  string id = 1;
  string name = 2;
  string prompt = 3;
  string model = 4;
  repeated string mcp_tools = 5;
  repeated string skills = 6;
  A2AConfig a2a_config = 7; // kind=AGENT_KIND_A2A 的 Agent 通过本字段更新接入配置；
                            // auth_token 为空时表示“不修改现有凭证”，非空则覆盖。
}

message UpdateAgentResponse {
  Agent agent = 1;
}

message DeleteAgentRequest {
  string id = 1;
}

message DeleteAgentResponse {}

message ListModelOptionsRequest {}

message ListModelOptionsResponse {
  repeated ModelOption models = 1;
}

message ListMcpToolOptionsRequest {
  string team_id = 1;
}

message ListMcpToolOptionsResponse {
  repeated ToolOption tools = 1;
}

message ListSkillOptionsRequest {}

message ListSkillOptionsResponse {
  repeated ToolOption skills = 1;
}

message CreateMcpToolRequest {
  // id 不对外开放指定入口，始终由服务端通过 internal/tools.NewMCPToolID 生成
  // "mcp_tool_<6位随机数字/字母>" 形式的 id，因此保留字段号 1 不再使用。
  reserved 1;
  reserved "id";
  string team_id = 2;            // 必填；决定该工具归属哪个团队，仅对该团队可见可选
  string name = 3;               // 必填
  string base_url = 4;           // 必填
  string api_key = 5;            // 非必填
  int32 timeout_seconds = 6;     // 非必填；留空(0)则由服务端默认设置为 30 秒
}

message CreateMcpToolResponse {
  McpTool tool = 1;
}

message GetMcpToolRequest {
  string id = 1;
}

message GetMcpToolResponse {
  McpTool tool = 1;
}

message UpdateMcpToolRequest {
  string id = 1;
  string name = 2;               // 必填
  string base_url = 3;           // 必填
  string api_key = 4;            // 非必填；留空表示不修改现有密钥，非空则覆盖
  int32 timeout_seconds = 5;     // 非必填；留空(0)则重置为默认 30 秒
}

message UpdateMcpToolResponse {
  McpTool tool = 1;
}
