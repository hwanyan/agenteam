syntax = "proto3";

package agenteam.v1;

import "google/api/annotations.proto";
import "common.proto";

option go_package = "github.com/hwanyan/agenteam/pb/gen/;agenteamv1";

// TeamService 负责团队的创建、查询与删除。
// 创建团队时会自动创建团队的主 Agent。
service TeamService {
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse) {
    option (google.api.http) = {
      post: "/v1/teams"
      body: "*"
    };
  }

  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option (google.api.http) = {
      get: "/v1/teams"
    };
  }

  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse) {
    option (google.api.http) = {
      get: "/v1/teams/{id}"
    };
  }

  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse) {
    option (google.api.http) = {
      delete: "/v1/teams/{id}"
    };
  }
}

// 创建团队时会一并创建其主 Agent，因此本请求同时携带主 Agent 的创建参数
// （字段含义与 CreateAgentRequest 中对应字段一致）：
//   - kind 未指定（AGENT_KIND_UNSPECIFIED）时按 AGENT_KIND_PROMPT 处理，兼容旧客户端
//     （只传 name 也能创建成功，prompt/model 留空时使用平台默认值）；
//   - kind=AGENT_KIND_A2A 时，主 Agent 直接链接一个外部 A2A Agent 提供方，
//     prompt/model/mcp_tools/skills 对该方式无效，a2a_config.endpoint_url 必填。
message CreateTeamRequest {
  string name = 1;
  string prompt = 2;             // kind=AGENT_KIND_PROMPT 时可选，留空使用平台默认主 Agent Prompt
  string model = 3;              // kind=AGENT_KIND_PROMPT 时可选，留空使用平台默认模型
  repeated string mcp_tools = 4;
  repeated string skills = 5;
  AgentKind kind = 6;             // 主 Agent 的创建方式，默认 AGENT_KIND_PROMPT
  A2AConfig a2a_config = 7;       // kind=AGENT_KIND_A2A 时必填（至少填 endpoint_url）
}

message CreateTeamResponse {
  Team team = 1;
  Agent main_agent = 2;
}

message ListTeamsRequest {}

message ListTeamsResponse {
  repeated Team teams = 1;
}

message GetTeamRequest {
  string id = 1;
}

message GetTeamResponse {
  Team team = 1;
}

message DeleteTeamRequest {
  string id = 1;
}

message DeleteTeamResponse {}
