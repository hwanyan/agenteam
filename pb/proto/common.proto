syntax = "proto3";

package agenteam.v1;

option go_package = "github.com/hwanyan/agenteam/pb/gen/;agenteamv1";

// Agent 运行状态
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_LOADED = 1;    // 已加载，可正常使用
  AGENT_STATUS_RELOADING = 2; // 保存后正在重新加载
  AGENT_STATUS_ERROR = 3;     // 加载失败
}

// Agent 的创建/接入方式。
enum AgentKind {
  AGENT_KIND_UNSPECIFIED = 0;
  AGENT_KIND_PROMPT = 1; // 平台内置：本地 Prompt + LLM 驱动（原有的唯一方式）
  AGENT_KIND_A2A = 2;    // 通过 A2A（Agent2Agent）协议链接一个外部 Agent 提供方
}

// 消息发送角色
enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_AGENT = 2;
  MESSAGE_ROLE_SYSTEM = 3;
}

// A2A（Agent2Agent）协议接入配置：把一个符合 A2A 协议的外部 Agent 接入为平台内的一个 Agent。
// 接入时后端会向 endpoint_url 发起 Agent Card 发现请求（GET {endpoint_url}/.well-known/agent-card.json），
// 校验对端可达并回填 remote_* 只读字段，供前端展示对端的真实能力。
message A2AConfig {
  string endpoint_url = 1;  // 外部 Agent 的服务地址（Agent Card 中 AgentInterface.url，或其 base url）
  string auth_scheme = 2;   // 鉴权方式，目前支持: ""（无）/ "bearer"
  string auth_token = 3;    // 鉴权凭证（如 Bearer Token）。写入专用：仅出现在
                             // CreateAgent/UpdateAgent 请求中；服务端任何响应都不会回显真实值
                             // （见 auth_token_set），避免密钥泄露给前端。
  bool auth_token_set = 4;  // 只读：标记当前是否已配置鉴权凭证（不回显具体值）
  string remote_agent_name = 5;    // 只读：从对端 Agent Card 中获取到的名称
  string remote_description = 6;   // 只读：从对端 Agent Card 中获取到的描述
  repeated string remote_skills = 7; // 只读：对端 Agent Card 声明的技能名称列表
  bool streaming = 8;               // 只读：对端 Agent Card 中 capabilities.streaming 声明
  // 部分第三方 A2A Agent 采用"TenantID + Token"双因子鉴权模型（如本项目的姊妹项目
  // agently）：除 Authorization: Bearer <token> 外，还要求调用方通过
  // X-A2A-Tenant-Id 请求头显式声明自己的租户身份，服务端据此做身份查找、再与
  // token 比对，二者缺一不可。tenant_id 由对端预先分配给调用方，属非机密的身份
  // 标识（类似 AccessKeyId），因此与 auth_token 不同，可以在响应中如实回显，
  // 不需要脱敏。留空表示对端不需要该头（标准 A2A 单因子/无鉴权场景）。
  string tenant_id = 9;
}

// Agent 是团队中的最小执行单元，目前每个团队自动拥有一个主 Agent。
message Agent {
  string id = 1;
  string team_id = 2;
  string name = 3;
  string prompt = 4;
  string model = 5;             // 对应 ModelOption.id；仅 kind=AGENT_KIND_PROMPT 时有效
  repeated string mcp_tools = 6; // 对应 ToolOption.id 列表；仅 kind=AGENT_KIND_PROMPT 时有效
  repeated string skills = 7;    // 对应 SkillOption.id 列表；仅 kind=AGENT_KIND_PROMPT 时有效
  bool is_main = 8;
  int64 version = 9;             // 每次保存后自增，代表 Runtime 加载的版本
  AgentStatus status = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  AgentKind kind = 13;            // 创建方式：本地 Prompt 驱动 / A2A 协议链接外部 Agent
  A2AConfig a2a_config = 14;       // 仅 kind=AGENT_KIND_A2A 时有效
}

// 团队，创建时会自动生成一个主 Agent。
message Team {
  string id = 1;
  string name = 2;
  string main_agent_id = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

// 一次工具调用的展示信息，用于在工作区回复下方展示"这条回复过程中调用了哪个工具"。
message ToolCallInfo {
  string id = 1;         // 同一条回复内唯一；流式过程中据此把 running 更新为 done / error
  string name = 2;       // 展示名称（面向用户，不是内部 id）
  string kind = 3;       // "agent"：团队主 Agent 把请求委派给了某个子 Agent；
                         // "tool"：Agent（如接入的 A2A Agent）在处理过程中调用的工具
  string arguments = 4;  // 入参（JSON 字符串，过长会被截断）；可为空
  string status = 5;     // "running" | "done" | "error"
}

// 工作区中的一条聊天消息
message ChatMessage {
  string id = 1;
  string team_id = 2;
  string agent_id = 3;
  MessageRole role = 4;
  string content = 5;
  int64 created_at = 6;
  // 模型的思考过程（如 DeepSeek Reasoner 返回的 reasoning_content）；模型不提供时为空。
  string reasoning = 7;
  // 生成这条回复的过程中发生的工具调用，按发生顺序排列。
  repeated ToolCallInfo tool_calls = 8;
}

// 可选的 LLM 模型
message ModelOption {
  string id = 1;
  string name = 2;
  string provider = 3;
  string description = 4;
}

// 可选的 MCP 工具 / Skill，两者结构一致，分别用不同接口返回
message ToolOption {
  string id = 1;
  string name = 2;
  string description = 3;
  // 是否为某个团队自行接入的自定义 MCP 工具（true），区别于平台内置静态清单（false，默认值）。
  // 仅 ListMcpToolOptions 会返回 true 的情形；前端据此为自定义工具渲染"编辑"入口。
  bool is_custom = 4;
}

// McpTool 是某个团队自行接入的自定义 MCP 工具（区别于 internal/options.MCPTools() 提供的
// 平台内置静态清单）：创建成功后会与内置工具合并出现在 ListMcpToolOptions 的返回结果中
// （以 ToolOption 形式，Description 取 base_url），仅供归属团队内的 Agent 选择绑定——
// 自定义 MCP 工具按团队隔离，不同团队互不可见，而非全局共享。
message McpTool {
  string id = 1;              // 唯一标识；创建时由服务端生成 "mcp_tool_<6位随机数字/字母>" 形式的 id
  string team_id = 8;          // 归属团队 id；决定该工具仅对哪个团队的 Agent 可见可选
  string name = 2;             // 展示名称
  string base_url = 3;         // MCP 服务地址
  bool api_key_set = 4;        // 只读：是否已配置 API Key（不回显明文，避免密钥随查询接口泄露）
  int32 timeout_seconds = 5;   // 调用超时时间（秒）；创建时留空(0)则由服务端默认设置为 30
  int64 created_at = 6;
  int64 updated_at = 7;
}
